<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Same geometry as logo-mark.svg, on a full-bleed tile so it still holds up
       in a 16px tab. The header mark has no tile; a favicon needs one. Single
       colour at this size — two tones turn to mud at 16px. The accent is the
       darkened ember, which is the one that stays legible on a light tile. -->
  <rect width="32" height="32" rx="7" fill="#edecec"/>
  <g fill="none" stroke="#b83803" stroke-width="4" stroke-linecap="butt">
    <path d="M9 7 V25"/>
    <path d="M23 7 V25"/>
    <path d="M9 8.5 L23 23.5"/>
  </g>
</svg>
