name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: npm run build:web
        env:
          NIKI_WEB_URL: ${{ vars.NIKI_WEB_URL || 'https://niki-web.pages.dev' }}
          NIKI_DOCS_URL: ${{ vars.NIKI_DOCS_URL || 'https://niki-docs.pages.dev' }}

      - name: Build docs
        run: npm run build:docs
        env:
          NIKI_WEB_URL: ${{ vars.NIKI_WEB_URL || 'https://niki-web.pages.dev' }}
          NIKI_DOCS_URL: ${{ vars.NIKI_DOCS_URL || 'https://niki-docs.pages.dev' }}

      - name: Prettier check
        run: npm run format:check --workspace apps/web

      - name: Prettier check (docs)
        run: npm run format:check --workspace apps/docs || true
