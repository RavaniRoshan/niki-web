name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: npm run build:web

      - name: Build docs
        run: npm run build:docs

      - name: Prettier check
        run: npm run format:check --workspace apps/web

      - name: Prettier check (docs)
        run: npm run format:check --workspace apps/docs || true
